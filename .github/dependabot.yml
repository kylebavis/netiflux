version: 2

updates:
  # NuGet dependencies. Terminal.Gui is the one that matters: the app pins 2.4.17 and
  # works around two defects in it (see ThemeCatalog and tests/Netiflux.Ui.Tests/README.md),
  # so its updates are grouped alone and deserve a real look rather than an auto-merge.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    # No explicit `labels:` — Dependabot warned that the labels named here did not exist
    # in the repository, and it applies its own default labels anyway. Add a `labels:`
    # block back only after creating those labels, or the warning returns.
    groups:
      terminal-gui:
        patterns:
          - Terminal.Gui
      test-tooling:
        patterns:
          - xunit*
          - Microsoft.NET.Test.Sdk
          - coverlet*
      other:
        patterns:
          - "*"
        exclude-patterns:
          - Terminal.Gui
          - xunit*
          - Microsoft.NET.Test.Sdk
          - coverlet*

  # Workflow actions, so the release pipeline does not rot. Actions are pinned to commit
  # SHAs rather than tags; Dependabot understands that form and bumps both the SHA and
  # the trailing version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/New_York
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
